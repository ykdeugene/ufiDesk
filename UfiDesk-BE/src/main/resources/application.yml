spring:
  application:
    name: ufidesk

  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/ufidesk?authSource=admin
      database: ufidesk

  session:
    store-type: mongodb
    timeout: 30m
    mongodb:
      collection-name: sessions

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax                # Prevent CSRF attacks - Lax allows top-level navigation
        http-only: true               # Prevent JavaScript access to session cookie (XSS protection)
        secure: false                 # Set to true in production with HTTPS
        max-age: 1800                 # 30 minutes in seconds
        path: /                       # Cookie available for entire application
        domain: localhost             # Change to actual domain in production
        name: JSESSIONID              # Standard session cookie name

# CORS Configuration
cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Logging Configuration
logging:
  level:
    root: INFO
    com.ufidesk: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.session: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
